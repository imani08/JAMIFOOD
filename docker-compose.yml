x-dev-source-mounts: &dev-source-mounts
  - ./package.json:/app/package.json:ro
  - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
  - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
  - ./turbo.json:/app/turbo.json:ro
  - ./apps/api/src:/app/apps/api/src
  - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json:ro
  - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json:ro
  - ./apps/api/package.json:/app/apps/api/package.json:ro
  - ./apps/web/app:/app/apps/web/app
  - ./apps/web/components:/app/apps/web/components
  - ./apps/web/lib:/app/apps/web/lib
  - ./apps/web/public:/app/apps/web/public
  - ./apps/web/next.config.ts:/app/apps/web/next.config.ts:ro
  - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
  - ./apps/web/package.json:/app/apps/web/package.json:ro
  - ./apps/client/app:/app/apps/client/app
  - ./apps/client/public:/app/apps/client/public
  - ./apps/client/next.config.ts:/app/apps/client/next.config.ts:ro
  - ./apps/client/tsconfig.json:/app/apps/client/tsconfig.json:ro
  - ./apps/client/package.json:/app/apps/client/package.json:ro
  - ./packages/database/prisma:/app/packages/database/prisma
  - ./packages/database/src:/app/packages/database/src
  - ./packages/database/tsconfig.json:/app/packages/database/tsconfig.json:ro
  - ./packages/database/package.json:/app/packages/database/package.json:ro
  - ./packages/shared/src:/app/packages/shared/src
  - ./packages/shared/tsconfig.json:/app/packages/shared/tsconfig.json:ro
  - ./packages/shared/package.json:/app/packages/shared/package.json:ro
  - ./packages/validation/src:/app/packages/validation/src
  - ./packages/validation/tsconfig.json:/app/packages/validation/tsconfig.json:ro
  - ./packages/validation/package.json:/app/packages/validation/package.json:ro
  - root_node_modules:/app/node_modules
  - product_images:/app/storage/product-images
  - client_photos:/app/storage/client-photos
  - web_next:/app/apps/web/.next
  - client_next:/app/apps/client/.next

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jami_food
      POSTGRES_USER: jami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jami_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jami -d jami_food"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://jami:${POSTGRES_PASSWORD:-jami_dev_password}@postgres:5432/jami_food?schema=public
      WEB_ORIGIN: http://localhost:3000,http://localhost:3002
      COOKIE_SECURE: "false"
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      RESTAURANT_TIMEZONE: ${RESTAURANT_TIMEZONE:-Africa/Kinshasa}
      PUBLIC_PRICE_CATEGORY_CODE: ${PUBLIC_PRICE_CATEGORY_CODE:-ETUDIANT_EXTERNE}
      QR_TOKEN_ENCRYPTION_KEY: ${QR_TOKEN_ENCRYPTION_KEY:-}
      CLIENT_APP_URL: ${CLIENT_APP_URL:-http://localhost:3002}
      CLIENT_PUBLIC_URL: ${CLIENT_PUBLIC_URL:-http://localhost:3002}
      MAIL_MODE: ${MAIL_MODE:-development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-JAMI FOOD <noreply@example.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PRODUCT_IMAGE_DIR: /app/storage/product-images
      CLIENT_PHOTO_DIR: /app/storage/client-photos
      TPE_MODE: ${TPE_MODE:-MOCK}
      TPE_PROVIDER: ${TPE_PROVIDER:-}
      TPE_TERMINAL_ID: ${TPE_TERMINAL_ID:-}
      TPE_MERCHANT_ID: ${TPE_MERCHANT_ID:-}
      TPE_API_URL: ${TPE_API_URL:-}
      TPE_API_KEY: ${TPE_API_KEY:-}
    volumes: *dev-source-mounts
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    command: ["sh", "-c", "pnpm --filter @jami/database build && pnpm --filter @jami/shared build && pnpm --filter @jami/validation build && pnpm --filter @jami/api dev"]

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    environment:
      NODE_ENV: development
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      WATCHPACK_POLLING: "true"
    volumes: *dev-source-mounts
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "pnpm --filter @jami/web dev"]

  client:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.client.dev
    environment:
      NODE_ENV: development
      PORT: 3002
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      WATCHPACK_POLLING: "true"
    volumes: *dev-source-mounts
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "pnpm --filter @jami/client dev"]

volumes:
  postgres_data:
  product_images:
  client_photos:
  root_node_modules:
  web_next:
  client_next:
