services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jami_food
      POSTGRES_USER: jami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jami_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jami -d jami_food"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      PRODUCT_IMAGE_DIR: /app/storage/product-images
    volumes:
      - product_images:/app/storage/product-images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  product_images: {}
  postgres_data: {}
